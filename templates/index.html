<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>出走表ビューワ</title>
    <script>
        async function loadVenues() {
            const date = document.getElementById("date").value;
            const response = await fetch(`/venue?date=${date}`);
            const data = await response.json();
            const venueSelect = document.getElementById("venue");
            venueSelect.innerHTML = data.venues.map(v => `<option value="${v}">${v}</option>`).join("");
            loadRaces(); // venue更新後にraceも更新
        }

        async function loadRaces() {
            const date = document.getElementById("date").value;
            const venue = document.getElementById("venue").value;
            const response = await fetch(`/race?date=${date}&venue=${venue}`);
            const data = await response.json();
            const raceSelect = document.getElementById("race");
            raceSelect.innerHTML = data.races.map(r => `<option value="${r}">${r}</option>`).join("");
            loadEntries();
        }

        async function loadEntries() {
            const date = document.getElementById("date").value;
            const venue = document.getElementById("venue").value;
            const race = document.getElementById("race").value;
            const response = await fetch(`/entry?date=${date}&venue=${venue}&race=${race}`);
            const table = document.getElementById("entries");
            try {
                const data = await response.json();
                console.log("✅ 取得したdata:", data);  // 追加: デバッグ用ログ
                if (data.entries && data.entries.length > 0) {
                    table.innerHTML = `<tr><th>車番</th><th>選手名</th><th>級班</th><th>ライン</th></tr>` + data.entries.map(e =>
                        `<tr><td>${e.car_no}</td><td>${e.name_kanji}</td><td>${e.class}</td><td>${e.line_id}</td></tr>`
                    ).join("");
                } else {
                    table.innerHTML = "<tr><td colspan='4'>出走表データがありません。</td></tr>";
                }
            } catch (err) {
                table.innerHTML = `<tr><td colspan="4">出走表の取得中にエラーが発生しました。</td></tr>`;
                console.error("出走表取得エラー:", err);
            }
        }
    </script>
</head>
<body>
    <h2>出走表選択</h2>
    <label>日付:
        <select id="date" onchange="loadVenues()">
            {% for d in dates %}
                <option value="{{ d }}">{{ d }}</option>
            {% endfor %}
        </select>
    </label>
    <label>競輪場:
        <select id="venue" onchange="loadRaces()"></select>
    </label>
    <label>レース:
        <select id="race" onchange="loadEntries()"></select>
    </label>
    <h3>出走表</h3>
    <table border="1" id="entries">
      <tr><th>車番</th><th>選手名</th><th>級班</th><th>ライン</th></tr>
    </table>
</body>
</html>
