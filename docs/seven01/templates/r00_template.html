<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>レース詳細 | グレードレース予想</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #0f172a, #1e40af);
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 14px 40px;
    }

    .nav {
      margin-bottom: 16px;
    }

    .nav a {
      text-decoration: none;
      color: #1d4ed8;
      font-weight: 700;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .title {
      font-weight: 800;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-right: 6px;
    }

    .arare {
      background: #e0f2fe;
      color: #0369a1;
    }

    .waiting {
      background: #fef3c7;
      color: #92400e;
    }

    .ready {
      background: #dcfce7;
      color: #166534;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #e5e7eb;
      text-align: center;
    }

    th {
      background: #f1f5f9;
    }
  </style>
</head>
<body>

<header>
  <h1>サンプル競輪場 00R</h1>
</header>

<main>

  <div class="nav">
    <a href="../index.html">← 一覧に戻る</a>
  </div>

  <div class="card">
    <div class="title">レース情報</div>
    <span class="badge arare">荒れ度 --</span>
    <span class="badge waiting">オッズ更新待ち</span>
    <p>発走予定：--:--</p>
  </div>

  <div class="card">
    <div class="title">AI予想（買い目）</div>
    <table>
      <thead>
        <tr>
          <th>買い目</th>
          <th>確率</th>
          <th>オッズ</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1-2</td>
          <td>12.3%</td>
          <td>--</td>
        </tr>
        <tr>
          <td>1-2-3</td>
          <td>4.5%</td>
          <td>--</td>
        </tr>
      </tbody>
    </table>
  </div>


</main>

</body>
</html>
