<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旧予想アーカイブ | 競輪AIアタルくん neo</title>
  <style>
    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
      background: #f4f6f9;
      color: #172033;
    }

    .page {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .hero {
      background: #ffffff;
      border: 1px solid #dde3ea;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(23, 32, 51, 0.06);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .sub {
      margin: 0;
      line-height: 1.7;
      color: #586274;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #ffffff;
      border: 1px solid #dde3ea;
      border-radius: 16px;
      padding: 22px;
    }

    .card:hover {
      border-color: #98a4b5;
    }

    .label {
      font-size: 13px;
      color: #7a8494;
      margin-bottom: 6px;
    }

    .title {
      font-size: 19px;
      font-weight: 700;
    }

    .arrow {
      margin-top: 18px;
      font-weight: 700;
    }

    .back {
      margin-top: 28px;
    }

    .back a {
      color: #334e7d;
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 680px) {
      .menu {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="hero">
      <h1>旧予想アーカイブ</h1>
    </section>

    <section class="menu">
      <a class="card" href="./archive/">
        <div class="label">旧予想</div>
        <div class="title">予想アーカイブ</div>
        <div class="arrow">開く →</div>
      </a>

      <a class="card" href="./profit/index.html">
        <div class="label">旧収支</div>
        <div class="title">収支実績</div>
        <div class="arrow">見る →</div>
      </a>
    </section>

    <div class="back">
      <a href="../index.html">← 現在のトップページへ戻る</a>
    </div>
  </main>
</body>
</html>
