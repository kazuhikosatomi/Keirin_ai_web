<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172033">
  <title>競輪AIアタルくん</title>

  <style>
  :root {
    --bg: #eef3f8;
    --panel: #ffffff;
    --line: #d8e1ea;
    --text: #243142;
    --muted: #6e7c8e;
    --blue: #3e78b8;
    --blue-dark: #2f5f93;
    --blue-soft: #eaf2fa;
    --accent: #6ca0d3;
    --gold: #b7934c;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Hiragino Sans",
      "Yu Gothic",
      sans-serif;
    color: var(--text);
    background:
      linear-gradient(180deg, #e9f1f8 0%, #f4f7fa 260px, var(--bg) 100%);
  }

  a {
    color: inherit;
  }

  .page {
    width: min(1040px, calc(100% - 28px));
    margin: 0 auto;
    padding: 24px 0 52px;
  }

  .hero {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 26px;
    margin-bottom: 18px;
    box-shadow: 0 10px 26px rgba(52, 81, 111, .08);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .brand-icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    box-shadow: 0 6px 16px rgba(42, 66, 92, .14);
    flex: 0 0 auto;
  }

  .brand-copy {
    min-width: 0;
  }

  .site-title {
    margin: 0;
    font-size: clamp(25px, 5vw, 33px);
    line-height: 1.15;
    font-weight: 850;
    color: #26384c;
  }

  .site-sub {
    margin: 7px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  .edition {
    display: inline-flex;
    margin-top: 8px;
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .12em;
    color: var(--blue-dark);
    background: var(--blue-soft);
    border: 1px solid #d5e3f1;
  }

  .transition {
    margin-top: 20px;
    padding: 17px 18px;
    border-radius: 15px;
    border: 1px solid #d2dfec;
    background: #f4f8fc;
  }

  .transition h2 {
    margin: 0 0 7px;
    font-size: 18px;
    color: var(--blue-dark);
  }

  .transition p {
    margin: 5px 0;
    line-height: 1.7;
    color: #617286;
  }


  .section {
    margin-top: 17px;
    padding: 22px;
    border-radius: 19px;
    border: 1px solid var(--line);
    background: var(--panel);
    box-shadow: 0 8px 22px rgba(52, 81, 111, .06);
  }

  .section h2 {
    margin: 0 0 16px;
    font-size: 19px;
    color: #34485e;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 13px;
  }

  .card {
    position: relative;
    display: block;
    text-decoration: none;
    min-height: 126px;
    border-radius: 15px;
    padding: 19px;
    border: 1px solid #dfe6ee;
    background: #ffffff;
    transition:
      transform .18s ease,
      border-color .18s ease,
      box-shadow .18s ease;
  }

  .card:hover {
    transform: translateY(-2px);
    border-color: #b8cee3;
    box-shadow: 0 8px 18px rgba(52, 81, 111, .09);
  }

  .card-car9,
  .card-car7 {
    min-height: 142px;
    padding: 21px;
    overflow: hidden;
  }

  .card-car9 {
    border-color: #d6dbe1;
    background: linear-gradient(135deg, #f4f5f6 0%, #eef0f2 100%);
  }

  .card-car7 {
    border-color: #f3cfd2;
    background: linear-gradient(135deg, #fff5f5 0%, #fff0f1 100%);
  }

  .card-car9::after,
  .card-car7::after {
    position: absolute;
    right: 12px;
    bottom: -27px;
    font-size: 142px;
    line-height: 1;
    font-weight: 900;
    pointer-events: none;
    z-index: 0;
  }

  .card-car9::after {
    content: "9";
    color: rgba(80, 87, 94, .16);
  }

  .card-car7::after {
    content: "7";
    color: rgba(220, 72, 82, .16);
  }

  .card-label {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 76px;
    padding: 4px 14px;
    border-radius: 999px;
    font-size: 11px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: .08em;
    margin-bottom: 9px;
  }

  .card-car9 .card-label {
    color: #ffffff;
    background: #8b8f92;
  }

  .card-car7 .card-label {
    color: #ffffff;
    background: #ed7b82;
  }

  .card-title {
    position: relative;
    z-index: 1;
    font-size: 20px;
    font-weight: 820;
  }

  .card-car9 .card-title {
    color: #666b70;
  }

  .card-car7 .card-title {
    color: #e66d75;
  }

  .card-status {
    position: relative;
    z-index: 1;
    margin-top: 8px;
    color: var(--muted);
  }

  .card-arrow {
    position: relative;
    z-index: 1;
    margin-top: 17px;
    font-weight: 750;
    color: var(--blue-dark);
  }

  .card-car9 .card-arrow {
    color: #666b70;
  }

  .card-car7 .card-arrow {
    color: #e66d75;
  }

  .disabled {
    opacity: .6;
    pointer-events: none;
  }

  .section:nth-of-type(4) {
    background: #fbfaf7;
  }

  .section:nth-of-type(4) .card {
    background: #fffefa;
    border-color: #ebe3d5;
  }

  .section:nth-of-type(4) .card-label {
    color: var(--gold);
  }

  @media (max-width: 720px) {
    .page {
      width: min(100% - 20px, 1040px);
      padding-top: 12px;
    }

    .hero {
      padding: 19px;
      border-radius: 19px;
    }

    .brand {
      gap: 12px;
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
    }

    .site-title {
      font-size: 24px;
    }

    .section {
      padding: 16px;
      border-radius: 17px;
    }

    .grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .card {
      min-width: 0;
    }

    .card-car9,
    .card-car7 {
      min-height: 142px;
      padding: 16px;
    }

    .card-car9::after,
    .card-car7::after {
      right: 4px;
      bottom: -22px;
      font-size: 112px;
    }
  }
</style>

  <script>
    async function loadSiteState() {
      const box = document.getElementById('transition-box');

      if (box) {
        box.hidden = false;
      }

      const preopen = document.getElementById('transition-preopen');
      const title = document.getElementById('transition-title');
      const message = document.getElementById('transition-message');

      if (preopen) {
        preopen.textContent = '現在プレオープン中です';
      }

      if (title) {
        title.textContent = 'サイトリニューアルしました';
      }

      if (message) {
        message.textContent =
          '予想ロジックを変更し、レース予想に「AI1着率」「AI3連対率」などを追加しました。7車レースのAI予想も不定期で公開していきます。';
      }

      try {
        const res = await fetch('./public/site_state.json', {
          cache: 'no-store'
        });

        if (!res.ok) throw new Error();

        const state = await res.json();

        const car9 = document.getElementById('today-car9-card');
        const car9Status = document.getElementById('today-car9-status');

        if (car9) {
          if (state.show_car9) {
            car9.classList.remove('disabled');

            try {
              const latestRes = await fetch(
                './public/latest/car9/latest.json',
                { cache: 'no-store' }
              );

              if (latestRes.ok) {
                const latest = await latestRes.json();
                const items = Array.isArray(latest.items)
                  ? latest.items
                  : [];

                if (items.length > 0) {
                  const item = items[0];

                  if (car9Status) {
                    car9Status.textContent = item.title || '';
                  }

                  if (item.href) {
                    car9.href = item.href;
                  }
                }
              }
            } catch (latestError) {
              console.error(
                'car9 latest load failed',
                latestError
              );
            }

          } else {
            car9.classList.add('disabled');

            if (car9Status) {
              car9Status.textContent =
                state.car9_status || '開催なし';
            }
          }
        }

      } catch (e) {
        console.error('site_state load failed', e);
      }
    }

    async function updateCar7Cards() {
      const watchCard = document.getElementById('today-car7-card');
      const otherCard = document.getElementById('other-car7-card');
      const watchStatus = document.getElementById('today-car7-status');

      if (!watchCard || !otherCard) return;

      try {
        const res = await fetch(
          './public/latest/car7/latest.json',
          { cache: 'no-store' }
        );

        if (!res.ok) throw new Error();

        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];

        const now = new Date();
        const today = [
          now.getFullYear(),
          String(now.getMonth() + 1).padStart(2, '0'),
          String(now.getDate()).padStart(2, '0'),
        ].join('-');

        const isToday = data.date === today;

        const hasWatch = isToday && items.some(
          item => item.publish_group === 'watch'
        );

        const hasOther = isToday && items.some(
          item => item.publish_group === 'other'
        );

        // WATCH対象がなくても7車カード自体は残す。
        // 対象なしの場合は disabled + 「開催なし」表示。
        watchCard.style.display = '';
        otherCard.style.display = hasOther ? '' : 'none';

        if (hasWatch) {
          watchCard.classList.remove('disabled');

          if (watchStatus) {
            watchStatus.textContent = '';
          }
        } else {
          watchCard.classList.add('disabled');

          if (watchStatus) {
            watchStatus.textContent = '開催なし';
          }
        }

      } catch (e) {
        console.error('car7 latest load failed', e);

        // latest.json が無い/読めない場合もWATCHカードは残し、
        // 9車と同様に「開催なし」扱いにする。
        watchCard.style.display = '';
        watchCard.classList.add('disabled');

        if (watchStatus) {
          watchStatus.textContent = '開催なし';
        }

        otherCard.style.display = 'none';
      }
    }

    async function updateTodayPdfLink() {
      const card = document.getElementById('today-pdf-card');
      const title = document.getElementById('today-pdf-title');
      const arrow = document.getElementById('today-pdf-arrow');

      try {
        const res = await fetch(
          './predict/pdf/gr01/latest.json',
          { cache: 'no-store' }
        );

        if (!res.ok) throw new Error();

        const data = await res.json();

        if (data.href) {
          card.href = data.href;
        }

        title.textContent =
          data.label || '全レース予想（PDF）';

        arrow.textContent = 'PDFを見る →';

      } catch (e) {
        card.href = './archive.html';
        title.textContent = '本日の予想PDFはありません';
        arrow.textContent = 'アーカイブを見る →';
      }
    }

    loadSiteState();
    updateCar7Cards();
    updateTodayPdfLink();
  </script>
