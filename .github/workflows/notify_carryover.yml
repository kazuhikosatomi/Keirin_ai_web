name: Notify Carryover

on:
  schedule:
    - cron: '30 22 * * *'  # JSTで毎日7:30に実行（UTC基準）
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3

      - name: Pythonをセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: キャリーオーバー通知スクリプト実行
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_IDS: ${{ secrets.LINE_USER_IDS }}
        run: |
          echo "🔔 Start Carryover LINE notify"
          python scripts/notify/notify_carryover_line.py
          echo "🎉 Finish Carryover LINE notify"